name: bench

on:
  pull_request:
    paths:
      - "src/**"
      - "benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

# Nothing in this workflow pushes or writes to the repo.
permissions:
  contents: read

jobs:
  bench:
    # Ratio gates only: absolute numbers are meaningless on shared runners,
    # but C-vs-reference ratios divide the runner's noise out. Floors live in
    # benchmarks/ci-gates.json; the step summary carries the full table.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Run the benchmark suite in CI mode
        run: uv run python -m benchmarks --ci --json bench-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-result
          path: bench-result.json
