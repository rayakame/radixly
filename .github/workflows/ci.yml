name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing in this workflow pushes or writes to the repo.
permissions:
  contents: read

jobs:
  changes:
    # Which of the path-filtered suites a pull request touches; every other event runs them all.
    runs-on: ubuntu-latest
    outputs:
      wheels: ${{ steps.filter.outputs.wheels }}
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "wheels=true" >> "$GITHUB_OUTPUT"
            echo "bench=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$changed"
          match() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          echo "wheels=$(match '^(src/|pyproject\.toml$|MANIFEST\.in$|\.github/workflows/(ci|wheels)\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "bench=$(match '^(src/|benchmarks/|tests/reference/|README\.md$|docs/benchmarks/|\.github/workflows/(ci|bench)\.yml$|pyproject\.toml$|uv\.lock$)')" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Run ruff checks
        run: uv run --only-group nox nox -s lint

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Check formatting (ruff + clang-format)
        run: uv run --only-group nox nox -s format-check

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Run basedpyright (recommended mode, warnings fail)
        run: uv run --only-group nox nox -s pyright verifytypes

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Run clang-tidy (strict, warnings are errors)
        run: uv run --only-group nox nox -s tidy

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Build the docs (warnings and missing references are errors)
        run: uv run --only-group nox nox -s docs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: uv run --only-group nox nox -s pytest

  asan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run test suite under ASan+UBSan
        run: uv run --only-group nox nox -s asan

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      # A wheel without the compiled extension is broken by definition
      # (no pure-Python fallback exists) — fail loudly, never ship pure.
      - name: Verify wheel contents
        run: |
          unzip -l dist/*.whl
          unzip -l dist/*.whl | grep -q "radixly/__init__.py"
          unzip -l dist/*.whl | grep -qE "radixly/_core\..+\.(so|pyd)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  changelog:
    # Every PR carries a fragment, or the no-changelog label says why not.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Check for a changelog fragment
        run: uv run --only-group release towncrier check --compare-with origin/${{ github.base_ref }}

  wheels:
    # Every wheel on every platform, when the extension or its packaging changed.
    needs: changes
    if: needs.changes.outputs.wheels == 'true'
    uses: ./.github/workflows/wheels.yml

  bench:
    # The C-vs-reference ratio gates and the README/docs render check, when anything they read changed.
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    uses: ./.github/workflows/bench.yml

  complete:
    # The one status check the branch ruleset requires: green only when every job above passed or was
    # skipped by its own condition; a failure or a cancellation anywhere turns it red.
    name: CI complete
    if: always()
    needs: [changes, lint, format-check, pyright, tidy, docs, test, asan, build, changelog, wheels, bench]
    runs-on: ubuntu-latest
    steps:
      - name: Fail on any failed or cancelled job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '[.[] | select(.result == "failure" or .result == "cancelled")] | length == 0' > /dev/null
