name: wheels

# Pull requests reach this through ci.yml, which decides from the changed paths whether to call it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheels:
    # Every wheel runs the differential suite against its installed self.
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # manylinux + musllinux x86_64
          - ubuntu-24.04-arm # manylinux + musllinux aarch64
          - windows-latest # win AMD64
          - macos-15-intel # macOS x86_64
          - macos-latest # macOS arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    # A distro packager gets no wheel -- the sdist must stand alone.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Build the sdist and prove it stands alone
        run: |
          uv build --sdist
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz pytest hypothesis
          mkdir /tmp/sdist-test && tar xzf dist/*.tar.gz -C /tmp/sdist-test --strip-components=1
          cd /tmp/sdist-test && /tmp/sdist-venv/bin/python -m pytest tests --ignore=tests/bench -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
