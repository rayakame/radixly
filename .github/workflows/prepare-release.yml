name: prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR opened with the default token runs no CI; this one is a fine-grained PAT.
          token: ${{ secrets.RELEASE_PR_TOKEN }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Bump the version and fold the changelog fragments
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([abc]|rc)?[0-9]*$' || { echo "not a release version: $VERSION"; exit 1; }
          sed -i "s/^__version__: typing.Final\[str\] = \".*\"$/__version__: typing.Final[str] = \"$VERSION\"/" src/radixly/_about.py
          grep -q "\"$VERSION\"" src/radixly/_about.py
          uv lock
          uv run --only-group release towncrier build --version "$VERSION" --yes
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          git add -A
          git commit -m "Release $VERSION"
          git push -u origin "release/v$VERSION"
          python3 - > notes.md <<'EOF'
          import re, os, pathlib
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          version = os.environ["VERSION"]
          m = re.search(rf"^## {re.escape(version)} .*?(?=^## |\Z)", text, re.M | re.S)
          print(m.group(0).strip() if m else "No significant changes.")
          EOF
          gh pr create --title "Release $VERSION" --body-file notes.md --label no-changelog
