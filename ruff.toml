line-length = 120
target-version = "py311"

# CPython's own base64 suite, vendored byte for byte under the PSF license; neither linted nor reformatted.
exclude = ["tests/compat/test_stdlib_base64.py"]

[format]
docstring-code-format = true
docstring-code-line-length = 80
quote-style = "double"
line-ending = "lf"

[lint]
preview = true
select = ["ALL"]
ignore = [
    "ISC003", # we prefer explicit string concatenation
    "COM812", # missing trailing comma; conflicts with the formatter, which owns trailing commas
]

[lint.per-file-ignores]
"**/__init__.py" = [
    "F403", # unable to detect undefined names
]
"tests/**" = [
    "DOC",     # docstring sections vs signature; test docstrings explain intent, not parameters
    "D101",    # undocumented class: test names carry the intent
    "D102",    # undocumented method
    "D103",    # undocumented function
    "D105",    # undocumented magic method
    "S101",    # use of assert
    "PLR2004", # magic value comparison
    "SLF001",  # private member access
    "PLC2701", # private name import: tests reach _core and _api directly
    "S311",    # weak pseudo-random number generators: seeded payloads, not secrets
]
"{benchmarks,scripts}/**" = [
    "DOC",     # docstring sections vs signature
    "S101",    # use of assert
    "PLR2004", # magic value comparison
    "INP001",  # add __init__.py
    "T201",    # print: it is a CLI
    "S311",    # weak pseudo-random number generators: seeded payloads, not secrets
    "PLC2701", # private name import: the benchmarks time _core directly
]
"noxfile.py" = [
    "S101",    # use of assert
]

[lint.isort]
required-imports = ["from __future__ import annotations"]
force-single-line = true

[lint.pydocstyle]
convention = "numpy"
