[project]
name = "radixly"
version = "0.1.0.dev0"
description = "Fast binary-to-text codecs: base32768 and friends"
readme = "README.md"
authors = [
    { name = "Christopher", email = "github.android206@passmail.net" }
]
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: C",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    { include-group = "clang" },
    { include-group = "nox" },
    { include-group = "pytest" },
    { include-group = "ruff" },
]
clang = [
    "clang-format>=19",
    "clang-tidy>=19",
]
nox = [
    "nox>=2026.8.17",
]
pytest = [
    "pytest>=9.1.1",
    "hypothesis>=6.100",
]
ruff = [
    "ruff>=0.16.3",
]

[tool.setuptools]
ext-modules = [
  {name = "radixly._core", sources=["src/radixly/_core.c", "src/radixly/base32768/base32768.c"]}
]

# Keep C sources and headers out of binary wheels for every (sub)package;
# sdists still ship them (ext-modules sources + MANIFEST.in headers).
[tool.setuptools.exclude-package-data]
"*" = ["*.c", "*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
