[project]
name = "radixly"
version = "0.1.0.dev0"
description = "Fast binary-to-text codecs: base32768 and friends"
readme = "README.md"
authors = [
    { name = "Christopher", email = "github.android206@passmail.net" }
]
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: C",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    { include-group = "bench" },
    { include-group = "clang" },
    { include-group = "nox" },
    { include-group = "pyright" },
    { include-group = "pytest" },
    { include-group = "ruff" },
]
bench = [
    "matplotlib>=3.10",
]
clang = [
    "clang-format>=19",
    "clang-tidy>=19",
]
nox = [
    "nox>=2026.8.17",
]
pytest = [
    "pytest>=9.1.1",
    "hypothesis>=6.100",
]
ruff = [
    "ruff>=0.16.3",
]
pyright = [
    "basedpyright>=1.39.10",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
include = ["noxfile.py", "src", "tests", "scripts", "benchmarks"]
# Resolve radixly from src/ so the checker sees the working tree, not the
# installed copy; consumers get types via py.typed + the verifytypes gate.
extraPaths = ["src"]
executionEnvironments = [
    { root = "tests", extraPaths = [".", "src"], pythonVersion = "3.11" },
    { root = "src", pythonVersion = "3.11" },
    { root = "scripts", pythonVersion = "3.14" },
    { root = "benchmarks", extraPaths = [".", "src"], pythonVersion = "3.11"  },
]

reportUnusedCallResult = "none" # every nox.session() triggers this

[tool.setuptools]
ext-modules = [
  {name = "radixly._core", sources=["src/radixly/_core.c", "src/radixly/base32768/base32768.c", "src/radixly/braille/braille.c", "src/radixly/hexagram/hexagram.c", "src/radixly/uro14/uro14.c", "src/radixly/_common/block.c", "src/radixly/_common/errors.c"], include-dirs=["src/radixly"], extra-compile-args=["-std=c11"]}
]

# Keep C sources and headers out of binary wheels for every (sub)package;
# sdists still ship them (ext-modules sources + MANIFEST.in headers).
[tool.setuptools.exclude-package-data]
"*" = ["*.c", "*.h"]

# PEP 561: the marker and the _core stub must ride the wheel, or installed
# consumers see an untyped package no matter how typed the source is.
[tool.setuptools.package-data]
radixly = ["py.typed", "*.pyi"]

# CPython-only (C-API internals), no free-threading (static globals).
# Warning flags (-Wall/-Wextra) are dev-only: MSVC rejects them, and the
# Linux CI matrix already enforces them. 64-bit only; no win32.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "pp* *t-* *-win32 *_i686"
build-verbosity = 1
test-requires = ["pytest>=9.1.1", "hypothesis>=6.100"]
test-command = "cd {project} && python -m pytest tests --ignore=tests/bench -q"

[tool.pytest.ini_options]
testpaths = ["tests"]
