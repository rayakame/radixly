[project]
name = "radixly"
dynamic = ["version"]
description = "Fast binary-to-text codecs for Python: base32768, base65536, base2048, uro14, braille and hexagram in C"
readme = "README.md"
authors = [
    { name = "rayakame", email = "github.android206@passmail.net" }
]
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
keywords = ["base32768", "base65536", "base2048", "uro14", "braille", "hexagram", "binary-to-text", "codec", "encoding", "unicode", "c-extension"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://radixly.rayakame.dev"
Documentation = "https://radixly.rayakame.dev/en/latest/"
Source = "https://github.com/rayakame/radixly"
Issues = "https://github.com/rayakame/radixly/issues"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    { include-group = "bench" },
    { include-group = "clang" },
    { include-group = "docs" },
    { include-group = "nox" },
    { include-group = "pyright" },
    { include-group = "pytest" },
    { include-group = "ruff" },
]
bench = [
    "base2048>=0.1.3",
    "base65536>=0.1.1",
    "matplotlib>=3.10",
]
clang = [
    "clang-format>=19",
    "clang-tidy>=19",
]
release = [
    "towncrier>=24.8",
]
docs = [
    "sphinx>=9.0",
    "furo>=2025.12",
    "myst-parser>=5.0",
    "sphinx-design>=0.7",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-autobuild>=2024.10",
    "sphinxext-opengraph>=0.10",
]
nox = [
    "nox>=2026.8.17",
]
pytest = [
    "pytest>=9.1.1",
    "hypothesis>=6.100",
]
ruff = [
    "ruff>=0.16.3",
]
pyright = [
    "basedpyright>=1.39.10",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
include = ["noxfile.py", "src", "tests", "scripts", "benchmarks"]
# Resolve radixly from src/ so the checker sees the working tree, not the
# installed copy; consumers get types via py.typed + the verifytypes gate.
extraPaths = ["src"]
executionEnvironments = [
    { root = "tests", extraPaths = [".", "src"], pythonVersion = "3.11" },
    { root = "src", pythonVersion = "3.11" },
    { root = "scripts", pythonVersion = "3.14" },
    { root = "benchmarks", extraPaths = [".", "src"], pythonVersion = "3.11"  },
]

reportUnusedCallResult = "none" # every nox.session() triggers this

[tool.towncrier]
package = "radixly"
directory = "changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/rayakame/radixly/pull/{issue})"
underlines = ["", "", ""]
ignore = ["README.md"]

[[tool.towncrier.type]]
directory = "feature"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Other"
showcontent = true

[tool.setuptools.dynamic]
version = { attr = "radixly._about.__version__" }

[tool.setuptools]
ext-modules = [
  {name = "radixly._core", sources=["src/radixly/_core.c", "src/radixly/base2048/base2048.c", "src/radixly/base32768/base32768.c", "src/radixly/base65536/base65536.c", "src/radixly/braille/braille.c", "src/radixly/hexagram/hexagram.c", "src/radixly/uro14/uro14.c", "src/radixly/_common/block.c", "src/radixly/_common/errors.c"], include-dirs=["src/radixly"], extra-compile-args=["-std=c11"]}
]

# Keep C sources and headers out of binary wheels for every (sub)package;
# sdists still ship them (ext-modules sources + MANIFEST.in headers).
[tool.setuptools.exclude-package-data]
"*" = ["*.c", "*.h"]

# PEP 561: the marker and the _core stub must ride the wheel, or installed
# consumers see an untyped package no matter how typed the source is.
[tool.setuptools.package-data]
radixly = ["py.typed", "*.pyi"]

# CPython-only (C-API internals), no free-threading (static globals).
# Warning flags (-Wall/-Wextra) are dev-only: MSVC rejects them, and the
# Linux CI matrix already enforces them. 64-bit only; no win32.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*t-* *-win32 *_i686"
build-verbosity = 1
test-requires = ["pytest>=9.1.1", "hypothesis>=6.100"]
# No `cd`: Windows cmd does not switch drives without /d.
test-command = "python -m pytest {project}/tests --ignore={project}/tests/bench -q"

[tool.pytest.ini_options]
testpaths = ["tests"]
