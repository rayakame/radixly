version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# The docs import radixly, so the extension is compiled in the build (the
# image ships gcc); uv resolves the locked docs group.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
